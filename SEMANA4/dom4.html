<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1>Añadir elementos a una lista</h1>
    <ul id="mi-lista"></ul>
    <script>
        //1. Crear el Elemento
        const item1=document.createElement("li")
        const item2=document.createElement("li")
        const item3=document.createElement("li")
        //2. Asignarle contenido
        item1.textContent="Comprar café"
        item2.textContent="Comprar leche"
        item3.textContent="Comprar pan"
        //3. Insertarlo en la lista
        const lista=document.getElementById("mi-lista")
        lista.appendChild(item1)
        lista.appendChild(item2)
        lista.appendChild(item3)
    </script>
</body>
</html>
