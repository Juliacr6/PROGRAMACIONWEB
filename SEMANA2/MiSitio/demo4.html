<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de tablas y forms</title>
</head>
<body>
    <h1>Formulario de Datos Personales</h1>
    <form action="">
    <table border="1">
        <tr>
            <td>DNI</td>
            <td><input type="number"name="dni" id="dni"></td>
        </tr>
        <tr>
            <td>NOMBRE</td>
            <td><input type="nombre"name="nombre" id="nombre"></td>
        </tr>
        <tr>
            <td>CORREO</td>
            <td><input type="email" name="correo" id="correo"></td>
        </tr>
        <tr>
            <td>FECHA DE NACIMIENTO</td>
            <td><input type="date" name="fechanac" id="fechanac"></td>
        <tr>
            <td>CLAVE</td>
            <td><input type="password"name="clave" id="clave"></td>
        <tr>
            <td><input type="submit" value="Enviar"></td>
            <td><input type="reset" value="Limpiar"></td>
        </tr>        
    </table>
    </form>
    
</body>
</html>
